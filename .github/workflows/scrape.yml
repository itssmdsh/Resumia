name: Daily job scraper
on:
  schedule:
    # Runs a lightweight time check every 15 minutes. The full scraper runs only
    # when the SCRAPER_RUN_TIME_UTC secret matches (for example, 03:30).
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
      SCRAPER_RUN_TIME_UTC: ${{ secrets.SCRAPER_RUN_TIME_UTC }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4.1-mini' }}
      AI_MAX_TOKENS: '1200'
      WORKER_BATCH_LIMIT: '50'
      WORKER_CONCURRENCY: '3'
      HTTP_CONFIDENCE_THRESHOLD: '7'
    steps:
      - id: schedule
        name: Check configured run time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          configured_time="${SCRAPER_RUN_TIME_UTC:-09:00}"
          if ! [[ "$configured_time" =~ ^([01][0-9]|2[0-3]):(00|15|30|45)$ ]]; then
            echo "SCRAPER_RUN_TIME_UTC must be UTC HH:MM at a 15-minute interval" >&2
            exit 1
          fi
          if [ "$(date -u +%H:%M)" = "$configured_time" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4
      - if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.schedule.outputs.should_run == 'true'
        run: npm ci
      - if: steps.schedule.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.schedule.outputs.should_run == 'true'
        name: Start local AI parser
        run: npm start > parser.log 2>&1 &
      - if: steps.schedule.outputs.should_run == 'true'
        name: Wait for local parser
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          cat parser.log
          exit 1
      - if: steps.schedule.outputs.should_run == 'true'
        name: Parse application links
        env:
          PARSER_API_URL: http://127.0.0.1:3000
        run: npm run worker
      - name: Show parser log on failure
        if: failure() && steps.schedule.outputs.should_run == 'true'
        run: cat parser.log || true
